name: Windows beta candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build unsigned NSIS installer
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      PYTHONUTF8: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-windows-build.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up stable Rust MSVC toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: Create Python build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-windows-build.txt

      - name: Install locked desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run Python tests
        run: .\.venv\Scripts\python.exe -m pytest -v

      - name: Validate frontend JavaScript
        shell: pwsh
        run: |
          node --check app/static/app.js
          node --check app/static/settings.js

      - name: Rebuild current PyInstaller sidecar
        working-directory: desktop
        run: npm run build:sidecar

      - name: Prepare desktop manifests
        working-directory: desktop
        run: npm run prepare

      - name: Verify desktop version synchronization
        run: .\.venv\Scripts\python.exe scripts/verify-desktop-version.py

      - name: Check Rust application
        working-directory: desktop/src-tauri
        run: cargo check --locked --target x86_64-pc-windows-msvc

      - name: Test Rust application
        working-directory: desktop/src-tauri
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Build unsigned Tauri and NSIS artifact
        working-directory: desktop
        run: npm run tauri:build

      - name: Stage installer and SHA-256 checksum
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath desktop/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer; found $($installers.Count)."
          }
          New-Item -ItemType Directory -Path release-artifacts | Out-Null
          $installer = $installers[0]
          $version = .\.venv\Scripts\python.exe -c "from app.version import __version__; print(__version__)"
          $destinationName = "FlightMargin-$version-Windows-x64.exe"
          $destination = Join-Path release-artifacts $destinationName
          Copy-Item -LiteralPath $installer.FullName -Destination $destination
          $checksum = Get-FileHash -LiteralPath $destination -Algorithm SHA256
          "$($checksum.Hash.ToLowerInvariant())  $destinationName" |
            Set-Content -LiteralPath "$destination.sha256" -Encoding ascii

      - name: Upload unsigned release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flightmargin-windows-unsigned-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
