name: Validate mobile relay

on:
  workflow_dispatch:
    inputs:
      validation:
        description: Validation target to run
        required: true
        type: choice
        options:
          - all
          - hosted-rate-limits
          - windows

permissions:
  contents: read

jobs:
  hosted-rate-limits:
    name: Validate hosted public rate limits
    if: ${{ inputs.validation == 'all' || inputs.validation == 'hosted-rate-limits' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install validation database driver
        run: python -m pip install "psycopg[binary]==3.3.6"

      - name: Validate hosted relay limits with scoped cleanup
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          FLIGHTMARGIN_RELAY_DATABASE_URL: ${{ secrets.FLIGHTMARGIN_RELAY_DATABASE_URL }}
        run: |
          node scripts/validate-relay-database-url.mjs
          python scripts/validate-hosted-mobile-relay.py --confirm-hosted

  windows:
    name: Validate Windows DPAPI and package
    if: ${{ inputs.validation == 'all' || inputs.validation == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      PYTHONUTF8: "1"
      FLIGHTMARGIN_RELAY_ENDPOINT: http://127.0.0.1:9
    steps:
      - name: Check out exact selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-windows-build.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up stable Rust MSVC toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: Create locked Python build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-windows-build.txt

      - name: Install locked desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run Windows and mobile-host tests
        run: .\.venv\Scripts\python.exe -m pytest -v

      - name: Validate native Windows DPAPI
        run: .\.venv\Scripts\python.exe scripts/validate-windows-dpapi.py

      - name: Validate frontend JavaScript
        shell: pwsh
        run: |
          node --check app/static/app.js
          node --check app/static/settings.js

      - name: Build and verify Python package contents
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip wheel --no-deps --wheel-dir dist .
          .\.venv\Scripts\python.exe scripts/verify-release.py dist

      - name: Rebuild current PyInstaller sidecar
        working-directory: desktop
        run: npm run build:sidecar

      - name: Prepare desktop manifests
        working-directory: desktop
        run: npm run prepare

      - name: Verify desktop version synchronization
        run: .\.venv\Scripts\python.exe scripts/verify-desktop-version.py

      - name: Check Rust application
        working-directory: desktop/src-tauri
        run: cargo check --locked --target x86_64-pc-windows-msvc

      - name: Test Rust application
        working-directory: desktop/src-tauri
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Build actual unsigned Tauri and NSIS package
        working-directory: desktop
        run: npm run tauri:build

      - name: Smoke packaged sidecar without Codex quota or hosted relay
        run: >-
          .\.venv\Scripts\python.exe scripts/smoke-packaged-sidecar.py
          desktop/src-tauri/binaries/codex-quota-backend-x86_64-pc-windows-msvc.exe

      - name: Verify local NSIS output
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath desktop/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer; found $($installers.Count)."
          }
          Write-Output "Validated one local unsigned NSIS installer."
