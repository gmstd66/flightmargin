<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FlightMargin</title>

    <link
        rel="stylesheet"
        href="/static/app.css?v=17"
    >
</head>

<body>

<div class="container">

    <header>
        <div>
            <h1>FlightMargin</h1>
            <p id="status" role="status" aria-live="polite">
                Connecting…
            </p>
        </div>

        <div class="header-actions"><button id="settings">Settings</button><button id="refresh">Refresh</button></div>
    </header>


    <main>

        <section id="dashboardGrid" class="dashboard-grid">

            <article class="card panel quota-card" data-panel="five-hour">

                <div class="card-heading">
                    <span>5-HOUR WINDOW</span>
                    <strong id="fiveRemaining">
                        --
                    </strong>
                </div>

                <div class="progress">
                    <div
                        id="fiveBar"
                        class="progress-bar"
                    ></div>
                </div>

                <div class="stats">
                    <span id="fiveUsed">
                        -- used
                    </span>

                    <span id="fiveReset">
                        --
                    </span>
                </div>

            </article>


            <article class="card panel quota-card" data-panel="weekly">

                <div class="card-heading">
                    <span>WEEKLY WINDOW</span>

                    <strong id="weeklyRemaining">
                        --
                    </strong>
                </div>

                <div class="progress">
                    <div
                        id="weeklyBar"
                        class="progress-bar"
                    ></div>
                </div>

                <div class="stats">
                    <span id="weeklyUsed">
                        -- used
                    </span>

                    <span id="weeklyReset">
                        --
                    </span>
                </div>

            </article>

            <article class="card panel pace-card" data-panel="pace">

                <span class="label">
                    WEEKLY PACE
                </span>

                <div id="paceStatus" class="pace">
                    --
                </div>

                <div id="paceRatio" class="pace-ratio">
                    --
                </div>

                <p id="paceDescription">
                    Waiting for data.
                </p>

                <p id="exhaustion">
                </p>

            </article>


            <article class="card panel summary-card" data-panel="resets">

                <span class="label">
                    FULL RESETS
                </span>

                <div
                    id="resetCredits"
                    class="large-value"
                >
                    --
                </div>

                <p>
                    Available rate-limit resets
                </p>

            </article>


            <article class="card panel summary-card" data-panel="account">

                <span class="label">
                    ACCOUNT
                </span>

                <div
                    id="plan"
                    class="large-value"
                >
                    --
                </div>

                <p id="credits">
                    Credits: --
                </p>

            </article>

        </section>

        <section class="card history-card panel" data-panel="history">

            <div class="history-heading">
                <div>
                    <span class="label">
                        WEEKLY HISTORY
                    </span>

                    <h2>
                        Last 7 days
                    </h2>
                </div>
            </div>

            <canvas
                id="historyCanvas"
                height="260"
            ></canvas>

        </section>

    </main>

</div>

<script src="/static/app.js?v=14"></script>

</body>
</html>
