[package]
name = "flightmargin-desktop"
version = "__APP_VERSION__"
description = "FlightMargin desktop shell"
authors = ["FlightMargin contributors"]
license = "AGPL-3.0-or-later"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
