[package]
name = "codex-quota-monitor-desktop"
version = "__APP_VERSION__"
description = "Codex Quota Monitor desktop shell"
authors = ["Codex Quota Monitor contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
url = "2"
