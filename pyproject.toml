[build-system]
requires = [
    "setuptools>=69",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "flightmargin"
dynamic = [
    "version",
]
description = "Lightweight, local-first monitor for OpenAI Codex usage limits, pacing, resets, credits, and history"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
]


[project.scripts]
flightmargin = "app.cli:main"
codex-quota = "app.cli:main"


[tool.setuptools.packages.find]
include = [
    "app",
    "app.*",
]


[tool.setuptools.dynamic]
version = {attr = "app.version.__version__"}


[tool.setuptools.package-data]
app = [
    "templates/*.html",
    "static/*",
]
